<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hey, Mr. Trucker 시스템 아키텍처</title>
  <desc id="desc">사용자 브라우저부터 AWS EC2의 Nginx, React, Spring Boot, MySQL 및 외부 서비스까지의 요청 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172033" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 800; letter-spacing: -0.7px; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .zone { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; }
      .node-title { font-size: 19px; font-weight: 800; }
      .node-sub { font-size: 13px; fill: #64748b; }
      .chip { font-size: 12px; font-weight: 700; }
      .flow-label { font-size: 12px; font-weight: 700; fill: #475569; }
      .main-line { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .api-line { fill: none; stroke: #64748b; stroke-width: 2.1; marker-end: url(#arrow-slate); }
      .webhook-line { fill: none; stroke: #ea580c; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <circle cx="1480" cy="30" r="280" fill="#eef4ff"/>
  <circle cx="100" cy="980" r="260" fill="#f0fdf4"/>

  <text x="72" y="62" class="title">Hey, Mr. Trucker · System Architecture</text>
  <text x="72" y="91" class="subtitle">실제 운영 환경의 요청 경로와 데이터·외부 서비스 연동 구조</text>

  <!-- Client -->
  <rect x="60" y="145" width="220" height="505" rx="24" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <text x="88" y="178" class="zone" fill="#64748b">CLIENT</text>
  <g filter="url(#shadow)">
    <rect x="88" y="215" width="164" height="164" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
    <rect x="126" y="246" width="88" height="57" rx="7" fill="#2563eb"/>
    <rect x="135" y="255" width="70" height="38" rx="3" fill="#dbeafe"/>
    <path d="M112 315 h116" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
    <text x="170" y="345" text-anchor="middle" class="node-title">웹 브라우저</text>
    <text x="170" y="368" text-anchor="middle" class="node-sub">사용자 · 관리자</text>
  </g>
  <rect x="88" y="416" width="164" height="92" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
  <text x="170" y="450" text-anchor="middle" class="node-title">React SPA</text>
  <text x="170" y="476" text-anchor="middle" class="node-sub">React 19 · TypeScript</text>
  <text x="170" y="497" text-anchor="middle" class="node-sub">Axios · React Router</text>
  <rect x="88" y="544" width="164" height="68" rx="14" fill="#f8fafc" stroke="#d9e1ec"/>
  <text x="170" y="570" text-anchor="middle" class="node-sub">JWT Access Token</text>
  <text x="170" y="593" text-anchor="middle" class="node-sub">Refresh Token Cookie</text>

  <!-- AWS boundary -->
  <rect x="340" y="125" width="1190" height="525" rx="26" fill="#ffffff" fill-opacity="0.82" stroke="#f59e0b" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="368" y="145" width="112" height="31" rx="15.5" fill="#fff7ed"/>
  <text x="424" y="166" text-anchor="middle" class="zone" fill="#c2410c">AWS EC2</text>

  <!-- Edge -->
  <text x="395" y="216" class="zone" fill="#64748b">EDGE</text>
  <g filter="url(#shadow)">
    <rect x="385" y="240" width="215" height="284" rx="21" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <circle cx="492" cy="285" r="24" fill="#16a34a"/>
    <text x="492" y="292" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">N</text>
    <text x="492" y="335" text-anchor="middle" class="node-title">Nginx</text>
    <text x="492" y="361" text-anchor="middle" class="node-sub">단일 진입점</text>
    <rect x="410" y="389" width="165" height="31" rx="10" fill="#dcfce7"/>
    <text x="492" y="409" text-anchor="middle" class="chip" fill="#166534">정적 파일 · SPA fallback</text>
    <rect x="410" y="430" width="165" height="31" rx="10" fill="#dcfce7"/>
    <text x="492" y="450" text-anchor="middle" class="chip" fill="#166534">API Reverse Proxy</text>
    <rect x="410" y="471" width="165" height="31" rx="10" fill="#dcfce7"/>
    <text x="492" y="491" text-anchor="middle" class="chip" fill="#166534">업로드 이미지 제공</text>
  </g>

  <!-- Application -->
  <text x="680" y="216" class="zone" fill="#64748b">APPLICATION</text>
  <g filter="url(#shadow)">
    <rect x="665" y="240" width="380" height="284" rx="21" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="855" y="284" text-anchor="middle" class="node-title">Spring Boot API</text>
    <text x="855" y="309" text-anchor="middle" class="node-sub">Java 21 · Spring Boot 3.5</text>
    <rect x="696" y="340" width="318" height="48" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="855" y="362" text-anchor="middle" class="chip" fill="#3730a3">Spring Security · JWT · OAuth2</text>
    <text x="855" y="379" text-anchor="middle" font-size="11" fill="#6366f1">인증 · 인가 · ROLE_USER / ROLE_ADMIN</text>
    <rect x="696" y="402" width="96" height="82" rx="12" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="744" y="435" text-anchor="middle" class="chip">Controller</text>
    <text x="744" y="458" text-anchor="middle" class="node-sub">REST API</text>
    <rect x="807" y="402" width="96" height="82" rx="12" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="855" y="435" text-anchor="middle" class="chip">Service</text>
    <text x="855" y="458" text-anchor="middle" class="node-sub">Transaction</text>
    <rect x="918" y="402" width="96" height="82" rx="12" fill="#ffffff" stroke="#d9e1ec"/>
    <text x="966" y="435" text-anchor="middle" class="chip">Repository</text>
    <text x="966" y="458" text-anchor="middle" class="node-sub">JPA</text>
  </g>

  <!-- Data -->
  <text x="1124" y="216" class="zone" fill="#64748b">DATA</text>
  <g filter="url(#shadow)">
    <rect x="1105" y="240" width="365" height="126" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <ellipse cx="1168" cy="282" rx="31" ry="11" fill="#93c5fd" stroke="#2563eb" stroke-width="1.7"/>
    <path d="M1137 282 v26 c0 6 14 11 31 11 s31-5 31-11 v-26" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.7"/>
    <text x="1230" y="290" class="node-title">MySQL 8</text>
    <text x="1230" y="315" class="node-sub">회원 · 상품 · 주문 · 결제</text>
    <text x="1230" y="338" class="node-sub">쿠폰 · 포인트 · 리뷰</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1105" y="398" width="365" height="126" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <path d="M1138 440 h38 l11 12 h47 v37 h-96z" fill="#fed7aa" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1260" y="449" class="node-title">EC2 File System</text>
    <text x="1260" y="475" class="node-sub">/opt/capshop/uploads</text>
    <text x="1260" y="498" class="node-sub">상품 · 리뷰 · 콘텐츠 이미지</text>
  </g>

  <!-- Main path -->
  <path d="M280 305 H385" class="main-line"/>
  <rect x="296" y="274" width="74" height="22" rx="11" fill="#eff6ff"/>
  <text x="333" y="289" text-anchor="middle" class="flow-label">HTTPS</text>
  <path d="M600 345 H665" class="main-line"/>
  <text x="632" y="333" text-anchor="middle" class="flow-label">/api</text>
  <path d="M1045 303 H1105" class="main-line"/>
  <text x="1075" y="290" text-anchor="middle" class="flow-label">JPA</text>
  <path d="M1045 460 H1105" class="main-line"/>
  <text x="1075" y="448" text-anchor="middle" class="flow-label">파일</text>
  <path d="M385 415 H315 Q295 415 295 435 V460 Q295 480 275 480 H252" class="api-line"/>
  <text x="318" y="447" text-anchor="middle" class="flow-label">HTML · JS · CSS</text>

  <!-- External services -->
  <rect x="60" y="704" width="1470" height="210" rx="25" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <text x="88" y="737" class="zone" fill="#64748b">EXTERNAL SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="105" y="770" width="280" height="104" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="245" y="811" text-anchor="middle" class="node-title">OAuth 2.0</text>
    <text x="245" y="839" text-anchor="middle" class="node-sub">Google · Kakao · Naver</text>
    <text x="245" y="860" text-anchor="middle" class="node-sub">인가 · 사용자 정보</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="475" y="770" width="280" height="104" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="615" y="811" text-anchor="middle" class="node-title">Toss Payments</text>
    <text x="615" y="839" text-anchor="middle" class="node-sub">결제 승인 · 취소 · 환불</text>
    <text x="615" y="860" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">Webhook · 가상계좌 입금 완료</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="845" y="770" width="280" height="104" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
    <text x="985" y="811" text-anchor="middle" class="node-title">Solapi SMS</text>
    <text x="985" y="839" text-anchor="middle" class="node-sub">휴대전화 인증</text>
    <text x="985" y="860" text-anchor="middle" class="node-sub">주문 완료 알림</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1215" y="770" width="270" height="104" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="1350" y="811" text-anchor="middle" class="node-title">도로명주소 API</text>
    <text x="1350" y="839" text-anchor="middle" class="node-sub">배송지 주소 검색</text>
    <text x="1350" y="860" text-anchor="middle" class="node-sub">브라우저에서 호출</text>
  </g>

  <!-- External paths, routed cleanly by columns -->
  <path d="M760 524 V674 H245 V770" class="api-line"/>
  <text x="270" y="690" class="flow-label">OAuth2</text>
  <path d="M825 524 V652 H615 V770" class="api-line"/>
  <text x="635" y="669" class="flow-label">REST API</text>
  <path d="M660 770 V682 H875 V524" class="webhook-line"/>
  <text x="741" y="699" class="flow-label" fill="#c2410c">Webhook</text>
  <path d="M930 524 V676 H985 V770" class="api-line"/>
  <text x="944" y="692" class="flow-label">REST API</text>
  <path d="M252 540 H305 V932 H1350 V874" class="api-line"/>
  <text x="1290" y="949" class="flow-label">주소 검색</text>

  <!-- Footer legend -->
  <line x1="72" y1="958" x2="120" y2="958" class="main-line"/>
  <text x="134" y="963" font-size="12" fill="#64748b">주요 요청 흐름</text>
  <line x1="255" y1="958" x2="303" y2="958" class="api-line"/>
  <text x="317" y="963" font-size="12" fill="#64748b">API·데이터 연동</text>
  <line x1="455" y1="958" x2="503" y2="958" class="webhook-line"/>
  <text x="517" y="963" font-size="12" fill="#64748b">외부 서비스에서 수신</text>
  <text x="1528" y="963" text-anchor="end" font-size="12" fill="#94a3b8">Production · heymrtrucker.com</text>
</svg>
