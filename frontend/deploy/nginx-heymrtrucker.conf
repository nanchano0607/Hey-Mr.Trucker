# heymrtrucker.com (frontend: Vite build 산출물 dist/, backend: localhost:8080)
# - SPA 라우팅: try_files ... /index.html
# - API/리소스: 백엔드로 reverse proxy

server {
  listen 80;
  server_name heymrtrucker.com www.heymrtrucker.com;

  # HTTPS를 쓰는 경우(권장): certbot 설정 후 80은 443로 리다이렉트하도록 교체하세요.
  # return 301 https://$host$request_uri;

  root /var/www/heymrtrucker/frontend/dist;
  index index.html;

  # Vite 산출물 캐시(선택) - dist/assets/* 만 캐시하는 편이 안전합니다.
  location ^~ /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # 백엔드가 서빙하는 이미지 경로
  # (프로젝트에서 /images/emptyload.png 같은 요청이 매우 많음)
  location ^~ /images/ {
    # EC2 파일시스템에서 바로 서빙 (권장)
    # /images/foo.png -> /opt/capshop/uploads/cap/foo.png
    alias /opt/capshop/uploads/cap/;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # 업로드 파일(상품/리뷰 등)
  # /uploads/cap/xxx.png -> /opt/capshop/uploads/cap/xxx.png
  # /uploads/review/yyy.png -> /opt/capshop/uploads/review/yyy.png
  location ^~ /uploads/ {
    alias /opt/capshop/uploads/;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # 백엔드 프록시 (프로젝트에서 실제로 쓰는 엔드포인트들)
  location ~ ^/(api|auth|oauth2|cart|cap|acc|product|notices|reviews|logbook|image|user)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OAuth2 callback (Spring Security): /login/oauth2/code/{provider}
  # 이 경로가 SPA로 떨어지면 로그인 콜백이 깨집니다.
  location ^~ /login/oauth2/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 단일 리소스 엔드포인트들
  location = /logo {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }
  location = /background {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
