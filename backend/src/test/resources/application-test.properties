# 동시성 테스트 등 통합 테스트 전용 프로필.
# 운영/로컬 MySQL을 건드리지 않도록 H2 인메모리 DB를 사용한다.
# 엔티티의 @Column(columnDefinition = "TEXT")(MySQL 전용 타입)를 H2에서도 인식하도록
# 연결 시 TEXT를 CLOB의 DOMAIN(별칭)으로 미리 만들어둔다.
spring.datasource.url=jdbc:h2:mem:capshop_test;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TEXT AS VARCHAR(65535)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# User 등 예약어와 충돌하는 테이블/컬럼명을 자동으로 quote 처리
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

toss.payments.secret-key=test_dummy_key

# JWT 서명 키(HS256, 32바이트 이상)와 CORS 허용 오리진 - 테스트 전용 더미 값
jwt.secret=test-only-jwt-secret-key-for-integration-tests-0123456789
app.cors.allowed-origins=http://localhost:5173

# 업로드 경로는 임시 디렉터리로 격리 (실제 uploads/ 를 건드리지 않는다)
app.upload-dir=${java.io.tmpdir}/capshop-test-uploads

# WebOAuthSecurityConfig 가 ClientRegistrationRepository 를 요구하므로 더미 클라이언트 하나만 등록 (외부 호출 없음)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
