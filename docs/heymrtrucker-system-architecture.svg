<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 36px; font-weight: 800; letter-spacing: -0.6px; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .zone-title { font-size: 17px; font-weight: 800; }
      .node-title { font-size: 19px; font-weight: 800; }
      .node-sub { font-size: 13px; fill: #64748b; }
      .small { font-size: 12px; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="90" y="70" class="title">Hey, Mr. Trucker — System Architecture</text>
  <text x="90" y="102" class="subtitle">React 기반 클라이언트와 Spring Boot API, 외부 결제·인증·알림 서비스를 연동한 이커머스 구조</text>

  <!-- Actors -->
  <rect x="65" y="180" width="200" height="620" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="220" class="zone-title" fill="#475569">CLIENT</text>
  <g filter="url(#shadow)">
    <rect x="95" y="285" width="140" height="125" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="165" cy="325" r="18" fill="#2563eb"/>
    <path d="M136 374 Q165 340 194 374" fill="#2563eb"/>
    <text x="165" y="397" text-anchor="middle" class="node-title">사용자</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="555" width="140" height="125" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="165" cy="595" r="18" fill="#7c3aed"/>
    <path d="M136 644 Q165 610 194 644" fill="#7c3aed"/>
    <text x="165" y="667" text-anchor="middle" class="node-title">관리자</text>
  </g>

  <!-- AWS zone -->
  <rect x="330" y="145" width="880" height="690" rx="28" fill="#ffffff" fill-opacity="0.72" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="9 7"/>
  <rect x="365" y="170" width="112" height="34" rx="17" fill="#fff7ed"/>
  <text x="421" y="193" text-anchor="middle" class="zone-title" fill="#c2410c">AWS EC2</text>

  <!-- Nginx -->
  <g filter="url(#shadow)">
    <rect x="385" y="375" width="180" height="150" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="475" y="426" text-anchor="middle" class="node-title">Nginx</text>
    <text x="475" y="455" text-anchor="middle" class="node-sub">HTTPS · Reverse Proxy</text>
    <text x="475" y="478" text-anchor="middle" class="node-sub">정적 리소스 제공</text>
  </g>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="645" y="245" width="230" height="155" rx="20" fill="#eefcff" stroke="#06b6d4" stroke-width="2.5"/>
    <text x="760" y="294" text-anchor="middle" class="node-title">React Frontend</text>
    <text x="760" y="325" text-anchor="middle" class="node-sub">React 19 · TypeScript</text>
    <text x="760" y="348" text-anchor="middle" class="node-sub">Vite · Axios · Router</text>
    <rect x="691" y="366" width="138" height="22" rx="11" fill="#cffafe"/>
    <text x="760" y="382" text-anchor="middle" class="small">사용자·관리자 UI</text>
  </g>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="645" y="500" width="300" height="235" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="795" y="546" text-anchor="middle" class="node-title">Spring Boot Backend</text>
    <text x="795" y="574" text-anchor="middle" class="node-sub">Java 21 · REST API · JPA</text>
    <rect x="680" y="598" width="230" height="42" rx="12" fill="#dcfce7"/>
    <text x="795" y="624" text-anchor="middle" font-size="14" font-weight="700">Spring Security · JWT · OAuth2</text>
    <rect x="680" y="652" width="105" height="42" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="733" y="678" text-anchor="middle" font-size="13" font-weight="700">Controller</text>
    <rect x="800" y="652" width="110" height="42" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="855" y="678" text-anchor="middle" font-size="13" font-weight="700">Service · JPA</text>
  </g>

  <!-- Data stores -->
  <g filter="url(#shadow)">
    <rect x="1010" y="465" width="155" height="125" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <ellipse cx="1088" cy="501" rx="43" ry="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <path d="M1045 501 v35 c0 8 19 14 43 14 s43-6 43-14 v-35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1088" y="576" text-anchor="middle" class="node-title">MySQL</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1010" y="630" width="155" height="105" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M1052 665 h30 l9 10 h34 v33 h-73z" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="1088" y="722" text-anchor="middle" class="node-title">Uploads</text>
  </g>

  <!-- External zone -->
  <rect x="1270" y="145" width="265" height="690" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1300" y="185" class="zone-title" fill="#475569">EXTERNAL SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="1300" y="230" width="205" height="105" rx="17" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="1402" y="268" text-anchor="middle" class="node-title">OAuth 2.0</text>
    <text x="1402" y="298" text-anchor="middle" class="node-sub">Google · Kakao · Naver</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1300" y="375" width="205" height="95" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="1402" y="412" text-anchor="middle" class="node-title">Toss Payments</text>
    <text x="1402" y="440" text-anchor="middle" class="node-sub">결제 승인 · 취소 · Webhook</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1300" y="510" width="205" height="95" rx="17" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="1402" y="547" text-anchor="middle" class="node-title">Solapi SMS</text>
    <text x="1402" y="575" text-anchor="middle" class="node-sub">본인 인증 · 주문 알림</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1300" y="645" width="205" height="95" rx="17" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1402" y="682" text-anchor="middle" class="node-title">Juso API</text>
    <text x="1402" y="710" text-anchor="middle" class="node-sub">도로명주소 검색</text>
  </g>

  <!-- Connections -->
  <path d="M235 347 H320 Q345 347 365 400 L385 425" class="line"/>
  <path d="M235 618 H320 Q345 618 365 500 L385 475" class="line"/>
  <path d="M565 420 C610 390 610 340 645 325" class="line"/>
  <path d="M565 485 C610 515 610 575 645 592" class="line"/>
  <path d="M760 400 V480" class="line"/>
  <path d="M945 555 H1010" class="line"/>
  <path d="M945 680 H1010" class="line"/>
  <path d="M945 610 C1110 610 1175 282 1300 282" class="dash"/>
  <path d="M945 610 C1110 610 1175 422 1300 422" class="dash"/>
  <path d="M945 620 C1110 620 1175 557 1300 557" class="dash"/>
  <path d="M875 300 C1080 300 1150 692 1300 692" class="dash"/>

  <!-- Legend -->
  <rect x="85" y="885" width="1430" height="65" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="125" y1="918" x2="180" y2="918" class="line"/>
  <text x="195" y="923" font-size="13">애플리케이션 요청·응답</text>
  <line x1="390" y1="918" x2="445" y2="918" class="dash"/>
  <text x="460" y="923" font-size="13">외부 API 연동</text>
  <text x="1455" y="923" text-anchor="end" class="small">Hey, Mr. Trucker · Full-stack E-commerce</text>
</svg>
